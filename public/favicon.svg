<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- XLIDE app icon. Follows the OS theme: ink tile in light mode, paper tile in dark mode. -->
  <style>
    .tile { fill: #161615 } .glyph { fill: #F1F0EC }
    @media (prefers-color-scheme: dark) { .tile { fill: #ECEBE6 } .glyph { fill: #121211 } }
  </style>
  <defs><mask id="m"><g fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"><path id="a" d="M42.5 15 L57.5 15 L55 50 L57.5 85 L42.5 85 L45 50 Z"/><use href="#a" transform="rotate(60 50 50)"/><use href="#a" transform="rotate(-60 50 50)"/></g><g fill="#000"><polygon points="45,35.5 92,46 92,52"/><polygon points="55,64.5 8,54 8,48"/></g></mask></defs>
  <rect class="tile" width="100" height="100"/>
  <g transform="translate(14 14) scale(0.72)"><rect class="glyph" width="100" height="100" mask="url(#m)"/></g>
</svg>
